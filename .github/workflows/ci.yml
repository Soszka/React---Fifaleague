name: CI - Lint, Build, Unit & E2E

on:
  push:
    branches: [main]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout kodu
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Node setup + cache npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3️⃣ Instalacja zależności
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Lint
      - name: Run lint
        run: npm run lint

      # 5️⃣ Build (żeby sprawdzić, czy się kompiluje)
      - name: Build project
        run: npm run build

      # 6️⃣ Unit testy (Vitest)
      - name: Run unit tests
        run: npm run test -- --run

      # 7️⃣ E2E testy (Playwright)
      - name: Run E2E tests
        run: npm run test:e2e

      # 8️⃣ Upload raportu Playwright (opcjonalny)
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
